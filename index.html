<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION VERSION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orion: '#9d4edd',
                        dark: '#12121f',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 0 0 8px rgba(157, 78, 221, 0.7);
            }
            .btn-glow {
                box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
            }
            .bg-pattern {
                background: linear-gradient(rgba(18, 18, 31, 0.85), rgba(18, 18, 31, 0.85)), 
                            url('https://picsum.photos/id/1068/1080/1920') center/cover no-repeat;
            }
        }
    </style>
</head>
<body class="bg-pattern min-h-screen text-white font-sans">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 mb-8 border border-orion/30">
            <h1 class="text-center text-2xl font-bold text-orion text-shadow">ORION VERSION</h1>
        </div>

        <div class="mb-8">
            <label class="block text-sm text-gray-300 mb-2">Nomor WhatsApp</label>
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">+62</span>
                <input type="text" id="nomorWA" placeholder="895-6372-91498" 
                       class="w-full bg-white/10 border border-orion/40 rounded-lg py-3 pl-14 pr-4 outline-none focus:border-orion focus:ring-1 focus:ring-orion transition-all">
            </div>
        </div>

        <div class="space-y-6 mb-10">
            <button onclick="proses('BUG')" 
                    class="w-full py-4 bg-gradient-to-r from-orion/80 to-purple-700 rounded-xl text-lg font-semibold btn-glow hover:from-orion hover:to-purple-600 transition-all transform hover:-translate-y-1">
                <i class="fa fa-bug mr-2"></i> BUG WHATSAPP
            </button>

            <button onclick="proses('KENON')" 
                    class="w-full py-4 bg-gradient-to-r from-orion/80 to-purple-700 rounded-xl text-lg font-semibold btn-glow hover:from-orion hover:to-purple-600 transition-all transform hover:-translate-y-1">
                <i class="fa fa-paper-plane mr-2"></i> KENON WHATSAPP
            </button>
        </div>

        <div id="notif" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-500/90 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all">
            <i class="fa fa-check-circle mr-2"></i> Teks disalin! Membuka email...
        </div>
    </div>

    <script>
        function proses(jenis) {
            const nomor = document.getElementById('nomorWA').value.replace(/\D/g, '');
            if (!nomor || nomor.length < 8) {
                alert('Masukkan nomor WhatsApp yang valid!');
                return;
            }

            let subjek, pesan;

            if (jenis === 'BUG') {
                subjek = 'URGENT: Serious Abuse and Violation Report';
                pesan = `Good afternoon WhatsApp Support Team,

I am writing to report a very serious issue regarding an account that has been abusing your platform severely.

The account number is: +62${nomor}

This account has been sending threatening messages, sharing explicit and harmful content, committing identity abuse, and harassing multiple users continuously. It has caused severe emotional distress, disrupted daily life, and violated WhatsApp Terms of Service and Community Guidelines repeatedly.

I have received multiple complaints from other users about the same number. This account is being used to spread harmful activities and create an unsafe environment for everyone.

I urgently request your team to:
1. Immediately investigate this account
2. Verify the violations committed
3. Restrict and disable this account permanently
4. Prevent this number from creating a new account

Please take strict action as soon as possible to stop further harm. Thank you for your urgent attention to this serious matter.`;
            } else {
                subjek = 'Request for Permanent Account Termination';
                pesan = `Good afternoon WhatsApp Support,

I would like to formally and urgently report the following account: +62${nomor}

This account has been confirmed to be used for harassment, sending spam, inappropriate content, and violating all policies of WhatsApp. It has disturbed many users and has been reported multiple times.

This account is no longer safe to remain active on your platform. I kindly request that you immediately review this account, confirm the violations, and permanently block it from using WhatsApp services.

Thank you for taking the necessary action promptly.`;
            }

            navigator.clipboard.writeText(pesan).then(() => {
                tampilkanNotif();
                const linkEmail = `mailto:support@whatsapp.com?subject=${encodeURIComponent(subjek)}&body=${encodeURIComponent(pesan)}`;
                setTimeout(() => window.location.href = linkEmail, 1000);
            });
        }

        function tampilkanNotif() {
            const notif = document.getElementById('notif');
            notif.classList.remove('translate-y-20', 'opacity-0');
            notif.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                notif.classList.remove('translate-y-0', 'opacity-100');
                notif.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
